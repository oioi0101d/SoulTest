
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SOULKILLER 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#090b10;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:12px;left:14px;font-size:22px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 8px black}
#bars{position:absolute;top:48px;left:14px;width:170px}
.bar{height:12px;margin:6px 0;background:#29262a;border:1px solid #777;border-radius:5px;overflow:hidden}
.fill{height:100%;width:100%;transition:width .15s}
#hp{background:#c42f38}#stamina{background:#d8a43c}
#bossUI{position:absolute;bottom:17%;left:12%;width:76%;text-align:center;display:none}
#bossName{font-size:13px;letter-spacing:2px;text-shadow:0 2px 5px black;margin-bottom:5px}
#bossBar{height:12px;background:#272025;border:1px solid #9b8172}
#bossFill{height:100%;width:100%;background:#a3212a}
#message{position:absolute;top:23%;width:100%;text-align:center;font-size:19px;font-weight:bold;text-shadow:0 2px 6px black}
#help{position:absolute;bottom:12px;left:12px;font-size:11px;color:#ddd;text-shadow:0 1px 5px black}
#controls{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;bottom:26px;left:24px;width:118px;height:118px;border-radius:50%;background:#ffffff16;border:2px solid #ffffff50;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#ded9d0a0;border:2px solid #fff9}
.actions{position:absolute;bottom:25px;right:18px;width:170px;height:150px;pointer-events:none}
.btn{position:absolute;border-radius:50%;background:#20242bd9;color:white;border:2px solid #c8b18b;font-weight:bold;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none}
.btn:active{background:#81613b}
#attack{width:70px;height:70px;right:0;bottom:10px;background:#6b2429e8}
#dodge{width:53px;height:53px;right:76px;bottom:0}
#block{width:48px;height:48px;right:77px;bottom:77px}
#magic{width:48px;height:48px;right:5px;bottom:91px;background:#273d68e8}
#start{position:fixed;inset:0;background:linear-gradient(#080b12dd,#090b10f5);display:flex;align-items:center;justify-content:center;z-index:5}
.panel{text-align:center;width:min(90%,390px);padding:25px;border:1px solid #8c7859;background:#11151ceF;box-shadow:0 0 55px #000}
.panel h1{font-size:39px;letter-spacing:5px;margin:0 0 8px;color:#d7c29a}
.panel p{color:#c3c3c3;line-height:1.5;font-size:14px}
#play{padding:15px 35px;border:1px solid #e0c79a;background:#493b2b;color:white;font-size:16px;letter-spacing:2px;font-weight:bold;margin-top:10px}
#loading{font-size:12px;color:#aaa}
@media(orientation:portrait){#logo{font-size:17px}#bars{top:40px;width:140px}#stick{width:105px;height:105px;bottom:18px;left:14px}#knob{left:27px;top:27px} .actions{transform:scale(.85);transform-origin:bottom right;right:8px;bottom:12px}#bossUI{bottom:19%}}
</style>
</head>
<body>
<div id="start">
 <div class="panel">
  <h1>SOULKILLER</h1>
  <p>AS ALMAS DOS MORTOS NÃO DESCANSAM.</p>
  <p>Explore as ruínas, derrote criaturas e enfrente o Guardião das Cinzas.</p>
  <button id="play">ENTRAR NO REINO</button>
  <p id="loading">Carregando mundo tridimensional...</p>
 </div>
</div>
<div id="hud">
 <div id="logo">SOULKILLER</div>
 <div id="bars">
  <div class="bar"><div class="fill" id="hp"></div></div>
  <div class="bar"><div class="fill" id="stamina"></div></div>
  <div id="stats" style="font-size:11px;text-shadow:0 2px 5px black">VIDA 100 · ALMAS 0</div>
 </div>
 <div id="message"></div>
 <div id="bossUI"><div id="bossName">GUARDIÃO DAS CINZAS</div><div id="bossBar"><div id="bossFill"></div></div></div>
 <div id="help">Explore o reino. Encontre o guardião.</div>
</div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="actions">
  <div class="btn" id="attack">ATACAR</div>
  <div class="btn" id="dodge">ESQUIVA</div>
  <div class="btn" id="block">DEFESA</div>
  <div class="btn" id="magic">✦</div>
 </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x171c28);
scene.fog=new THREE.FogExp2(0x171c28,0.009);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9caed4,0x272018,2.0));
const sun=new THREE.DirectionalLight(0xffd6a0,3);
sun.position.set(-30,45,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;
sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
scene.add(sun);

function mat(color,rough=.9,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const groundMat=mat(0x393a35),stoneMat=mat(0x62605b),
 darkStone=mat(0x333640),armorMat=mat(0x303947,.45,.65),
 goldMat=mat(0xb7a077,.4,.65),skinMat=mat(0x957c6b),
 woodMat=mat(0x3e3027),leafMat=mat(0x222f2b),
 redMat=mat(0x822c31,.5,.2);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),groundMat);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// Irregular rocks and ruined castle pieces.
function box(parent,x,y,z,sx,sy,sz,material,rot=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);m.rotation.y=rot;
 m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function rock(x,z,s){
 const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),stoneMat);
 m.position.set(x,s*.55,z);m.scale.set(1,.7,1.2);
 m.rotation.set(Math.random(),Math.random(),Math.random());
 m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
for(let i=0;i<190;i++){
 const a=Math.random()*Math.PI*2,r=12+Math.random()*85;
 rock(Math.cos(a)*r,Math.sin(a)*r,.3+Math.random()*1.7);
}
function tower(x,z,h){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,0,h/2,0,3,h,3,darkStone);
 box(g,0,h+.4,0,4,.8,4,stoneMat);
 for(let i=0;i<4;i++)box(g,0,h+.9,i%2?1.3:-1.3,3,.5,.5,stoneMat,i*Math.PI/2);
 for(let y=2;y<h-1;y+=3){
  box(g,0,y,1.52,.55,1.1,.12,mat(0x11151d));
 }
}
tower(-15,-27,17);tower(-23,-25,12);tower(17,-36,22);
for(let i=0;i<8;i++){
 box(scene,-20+i*3,2,-25,1.3,4,1.4,stoneMat,(Math.random()-.5)*.2);
}
// Dead trees.
for(let i=0;i<70;i++){
 const a=Math.random()*Math.PI*2,r=17+Math.random()*65;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;
 if(Math.abs(x)<7&&z>-15&&z<15)continue;
 const tree=new THREE.Group();tree.position.set(x,0,z);scene.add(tree);
 const h=3+Math.random()*6;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.38,h,6),woodMat);
 trunk.position.y=h/2;trunk.castShadow=true;tree.add(trunk);
 for(let b=0;b<3;b++){
  const branch=new THREE.Mesh(new THREE.CylinderGeometry(.05,.17,h*.45,5),woodMat);
  branch.position.set((Math.random()-.5)*1.5,h*.55,0);
  branch.rotation.z=(Math.random()-.5)*1.5;
  branch.rotation.x=(Math.random()-.5)*.8;tree.add(branch);
 }
}
// Glowing souls and torches.
const glowMat=new THREE.MeshBasicMaterial({color:0xff9a47});
for(let i=0;i<18;i++){
 const x=(Math.random()-.5)*65,z=-10-Math.random()*55;
 const flame=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),glowMat);
 flame.position.set(x,1.5,z);scene.add(flame);
 const light=new THREE.PointLight(0xff7838,3,7);
 light.position.copy(flame.position);scene.add(light);
}

// Player made from real 3D meshes.
const player=new THREE.Group();scene.add(player);
const body=new THREE.Group();player.add(body);
function limb(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
limb(body,0,1.25,0,.68,.85,.4,armorMat);
limb(body,0,1.8,0,.82,.25,.48,goldMat);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),armorMat);
head.position.set(0,2,0);head.castShadow=true;body.add(head);
limb(body,0,2.15,-.06,.43,.2,.45,darkStone);
const cape=limb(body,0,1.25,-.32,.58,.95,.08,redMat);
const legs=[];
for(const x of [-.21,.21]){
 const l=limb(body,x,.52,0,.25,.72,.3,armorMat);legs.push(l);
 limb(body,x,.13,.1,.3,.2,.45,darkStone);
}
const arms=[];
for(const x of [-.48,.48]){
 const a=limb(body,x,1.35,0,.22,.7,.25,armorMat);arms.push(a);
}
const sword=new THREE.Group();body.add(sword);
limb(sword,0,.5,0,.105,.95,.12,mat(0xc7d0d9,.3,.8));
limb(sword,0,.03,0,.4,.12,.18,goldMat);
limb(sword,0,-.19,0,.13,.35,.13,woodMat);
sword.position.set(.65,1.15,.05);sword.rotation.z=-.35;

// Shield.
const shield=new THREE.Mesh(new THREE.BoxGeometry(.55,.72,.12),goldMat);
shield.position.set(-.58,1.1,.05);body.add(shield);

// Enemies.
function makeEnemy(x,z,boss=false){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
 const scale=boss?2.4:1;
 const em=boss?redMat:mat(0x45464b,.7,.25);
 function part(px,py,pz,sx,sy,sz,ma=em){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),ma);
  m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m;
 }
 part(0,.95*scale,0,.75*scale,.9*scale,.5*scale);
 part(0,1.55*scale,0,.48*scale,.48*scale,.45*scale,darkStone);
 for(const x2 of [-.27,.27]){
  part(x2,.35*scale,0,.25*scale,.7*scale,.3*scale);
  part(x2*1.8,1.05*scale,0,.23*scale,.7*scale,.25*scale);
 }
 const blade=part(.7*scale,.8*scale,.1,.15*scale,1.4*scale,.15*scale,goldMat);
 blade.rotation.z=-.35;
 const eyeMat=new THREE.MeshBasicMaterial({color:boss?0xff3000:0xff8b32});
 for(const x2 of [-.12,.12]){
  const e=new THREE.Mesh(new THREE.SphereGeometry(.055*scale,8,8),eyeMat);
  e.position.set(x2,1.6*scale,.23*scale);g.add(e);
 }
 return {g,hp:boss?450:65,max:boss?450:65,boss,attack:0,blade};
}
const enemies=[];
enemies.push(makeEnemy(5,-7));
enemies.push(makeEnemy(-7,-12));
enemies.push(makeEnemy(9,-19));
const boss=makeEnemy(0,-34,true);enemies.push(boss);

// Atmospheric embers.
const particles=[];
for(let i=0;i<180;i++){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.035,5,5),new THREE.MeshBasicMaterial({color:i%2?0xe2a45b:0x8d99b6}));
 m.position.set((Math.random()-.5)*85,Math.random()*12-1,(Math.random()-.5)*85);
 scene.add(m);particles.push(m);
}

let started=false,dead=false,won=false;
let hp=100,stamina=100,souls=0;
let attackTimer=0,dodgeTimer=0,block=false,magicTimer=0;
let moving=false,joyX=0,joyY=0;
let last=performance.now(),msgTimer=0;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function message(t){$('message').textContent=t;msgTimer=2.5}
function updateUI(){
 $('hp').style.width=Math.max(0,hp)+'%';
 $('stamina').style.width=Math.max(0,stamina)+'%';
 $('stats').textContent='VIDA '+Math.ceil(hp)+' · ALMAS '+souls;
 $('bossUI').style.display=boss.hp>0&&Math.hypot(player.position.x-boss.g.position.x,player.position.z-boss.g.position.z)<27?'block':'none';
 $('bossFill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';
}
function bindHold(id,down,up=()=>{}){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{up()});
}
bindHold('attack',()=>attack());
bindHold('dodge',()=>dodge());
bindHold('block',()=>block=true,()=>block=false);
bindHold('magic',()=>castMagic());

function attack(){
 if(!started||dead||attackTimer>0||stamina<12)return;
 attackTimer=.55;stamina-=12;
 sword.rotation.x=0;sword.rotation.z=-1.8;
 let target=null,best=3.8;
 for(const e of enemies){
  if(e.hp<=0)continue;
  const d=Math.hypot(e.g.position.x-player.position.x,e.g.position.z-player.position.z);
  if(d<best){best=d;target=e}
 }
 if(target){
  target.hp-=target.boss?24:38;
  target.g.rotation.y=Math.atan2(player.position.x-target.g.position.x,player.position.z-target.g.position.z);
  if(target.hp<=0){
   souls+=target.boss?500:40;
   message(target.boss?'O GUARDIÃO CAIU!':'INIMIGO DERROTADO');
   if(target.boss){won=true;message('VITÓRIA! O GUARDIÃO FOI DERROTADO.')}
  }
 }
}
function dodge(){
 if(!started||dead||dodgeTimer>0||stamina<25)return;
 dodgeTimer=.4;stamina-=25;
 const dir=new THREE.Vector3(joyX,0,joyY);
 if(dir.length()<.1)dir.set(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
 dir.normalize();player.position.addScaledVector(dir,2.7);
}
function castMagic(){
 if(!started||dead||magicTimer>0||stamina<30)return;
 magicTimer=1;stamina-=30;
 let target=null,best=16;
 for(const e of enemies){
  if(e.hp<=0)continue;
  const d=Math.hypot(e.g.position.x-player.position.x,e.g.position.z-player.position.z);
  if(d<best){best=d;target=e}
 }
 if(target){
  target.hp-=target.boss?35:65;
  message('MAGIA DAS ALMAS!');
  if(target.hp<=0){souls+=target.boss?500:40;if(target.boss){won=true;message('VITÓRIA! O GUARDIÃO FOI DERROTADO.')}else message('INIMIGO DERROTADO');}
 }else message('NENHUM INIMIGO AO ALCANCE');
}

// Virtual joystick.
const stick=$('stick'),knob=$('knob');
let stickId=null,origin={x:0,y:0};
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);
 const r=stick.getBoundingClientRect();origin={x:r.left+r.width/2,y:r.top+r.height/2};moveJoy(e);
});
function moveJoy(e){
 if(stickId!==e.pointerId)return;
 let dx=e.clientX-origin.x,dy=e.clientY-origin.y;
 const max=34,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joyX=dx/max;joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointermove',moveJoy);
function resetJoy(){stickId=null;joyX=0;joyY=0;knob.style.transform='translate(0px,0px)'}
stick.addEventListener('pointerup',resetJoy);
stick.addEventListener('pointercancel',resetJoy);
stick.addEventListener('lostpointercapture',resetJoy);

$('play').onclick=()=>{
 started=true;$('start').style.display='none';
 message('ENCONTRE O GUARDIÃO DAS CINZAS');
};
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const time=clock.elapsedTime;
 if(started&&!dead&&!won){
  const forward=(keys['w']||keys['arrowup']?-1:0)+(keys['s']||keys['arrowdown']?1:0)+joyY;
  const side=(keys['d']||keys['arrowright']?1:0)+(keys['a']||keys['arrowleft']?-1:0)+joyX;
  const dir=new THREE.Vector3(side,0,forward);
  if(dir.length()>1)dir.normalize();
  if(dir.length()>.05&&dodgeTimer<=0){
   // Movement relative to the camera's horizontal direction.
   const camForward=new THREE.Vector3();
   camera.getWorldDirection(camForward);camForward.y=0;camForward.normalize();
   const camRight=new THREE.Vector3().crossVectors(camForward,new THREE.Vector3(0,1,0)).normalize();
   const move=camRight.clone().multiplyScalar(dir.x).addScaledVector(camForward,-dir.z);
   if(move.length()>.01){
    move.normalize();
    player.position.addScaledVector(move,5.2*dt);
    player.rotation.y=Math.atan2(move.x,move.z);
    moving=true;
   }
  }else moving=false;

  player.position.x=THREE.MathUtils.clamp(player.position.x,-95,95);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-95,95);
  if(attackTimer>0){
   attackTimer-=dt;
   sword.rotation.z=THREE.MathUtils.lerp(sword.rotation.z,-.35,dt*9);
  }else sword.rotation.z=THREE.MathUtils.lerp(sword.rotation.z,-.35,dt*7);
  if(dodgeTimer>0)dodgeTimer-=dt;
  if(magicTimer>0)magicTimer-=dt;
  stamina=Math.min(100,stamina+(block?5:18)*dt);

  for(const e of enemies){
   if(e.hp<=0)continue;
   const dx=player.position.x-e.g.position.x,dz=player.position.z-e.g.position.z;
   const d=Math.hypot(dx,dz);
   if(d<(e.boss?20:13)){
    e.g.rotation.y=Math.atan2(dx,dz);
    if(d>(e.boss?3.2:1.7)){
     e.g.position.x+=dx/d*(e.boss?1.45:.9)*dt;
     e.g.position.z+=dz/d*(e.boss?1.45:.9)*dt;
    }else{
     e.attack+=dt;
     if(e.attack>(e.boss?1.7:2.1)){
      e.attack=0;
      if(dodgeTimer<=0){
       hp-=block?e.boss?5:2:e.boss?17:9;
       if(hp<=0){hp=0;dead=true;message('VOCÊ MORREU — TOQUE PARA RECOMEÇAR');}
      }
     }
    }
   }
  }
  if(dead&&msgTimer<=0){
   $('start').style.display='flex';
   $('play').textContent='TENTAR NOVAMENTE';
   $('play').onclick=()=>location.reload();
   $('loading').textContent='As almas aguardam uma nova tentativa.';
  }
  if(won&&msgTimer<=0){
   $('start').style.display='flex';
   $('play').textContent='JOGAR NOVAMENTE';
   $('play').onclick=()=>location.reload();
   $('loading').textContent='Você venceu o Guardião das Cinzas!';
  }
  updateUI();
 }
 if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('message').textContent='';}
 // Follow camera.
 const targetPos=new THREE.Vector3(player.position.x,player.position.y+2.1,player.position.z);
 const behind=new THREE.Vector3(0,4.1,8.2).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
 const desired=targetPos.clone().add(behind);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(targetPos.x,targetPos.y-.15,targetPos.z);
 // Small movement animation.
 if(moving){
  legs[0].rotation.x=Math.sin(time*10)*.55;
  legs[1].rotation.x=-Math.sin(time*10)*.55;
  arms[0].rotation.x=-Math.sin(time*10)*.3;
  arms[1].rotation.x=Math.sin(time*10)*.3;
 }else{
  for(const l of legs)l.rotation.x=THREE.MathUtils.lerp(l.rotation.x,0,dt*8);
  for(const a of arms)a.rotation.x=THREE.MathUtils.lerp(a.rotation.x,0,dt*8);
 }
 for(let i=0;i<particles.length;i++){
  const p=particles[i];p.position.y+=dt*(.15+(i%4)*.1);
  p.position.x+=Math.sin(time+i)*dt*.12;
  if(p.position.y>12)p.position.y=-1;
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
