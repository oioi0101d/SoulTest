
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOULKILLER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080910;color:#eee;font-family:monospace;overflow:hidden}
button{background:#32233f;color:#fff;border:2px solid #a66bca;padding:10px 14px;font-family:monospace;font-weight:bold;border-radius:5px;cursor:pointer}
button:active{transform:scale(.95);background:#70428b}
#game{width:100vw;height:100dvh;display:block;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;top:8px;left:8px;right:8px;pointer-events:none;text-shadow:2px 2px #000;font-size:12px}
.bar{width:160px;height:12px;background:#25252b;border:1px solid #aaa;margin:4px 0 7px}
.fill{height:100%;width:100%;background:#c52338}
#xpbar{background:#e7b63d}
#actions{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
#actions button{pointer-events:auto;min-width:60px;min-height:58px;font-size:21px;background:#191722d9;touch-action:none}
#move{display:flex;gap:8px}
#fight{display:flex;gap:8px}
#panel{position:fixed;inset:0;background:#080910ed;display:flex;align-items:center;justify-content:center;z-index:5;padding:15px;overflow:auto}
.card{width:min(650px,100%);max-height:95dvh;overflow:auto;text-align:center;background:#15131f;border:2px solid #71428b;padding:20px;box-shadow:0 0 35px #4e1f69}
h1{color:#dca3ff;letter-spacing:5px;font-size:clamp(25px,6vw,46px);margin:10px}
h2{color:#dca3ff}
.small{font-size:12px;color:#bbb;line-height:1.6}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
#choices button{font-size:12px}
#message{position:fixed;top:44%;width:100%;text-align:center;font-size:18px;color:#ffe6a4;text-shadow:2px 2px #000;pointer-events:none}
.hidden{display:none!important}
@media(orientation:portrait){#rotate{display:block!important}}
#rotate{display:none;position:fixed;inset:0;background:#080910;z-index:10;text-align:center;padding-top:35vh;font-size:24px;color:#dca3ff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">↻<br>VIRE O CELULAR DE LADO</div>
<div id="hud">
 <div id="region">REGIÃO 1</div>
 <div id="playerstats">Nível 1 · XP 0/50 · Almas 0</div>
 <div>VIDA</div><div class="bar"><div id="hp" class="fill"></div></div>
 <div>EXPERIÊNCIA</div><div class="bar"><div id="xpbar" class="fill"></div></div>
 <div id="bossbox" class="hidden">CHEFE: <span id="bossname"></span><div class="bar"><div id="bosshp" class="fill"></div></div></div>
</div>
<div id="message"></div>
<div id="actions">
 <div id="move"><button id="left">◀</button><button id="right">▶</button><button id="jump">⬆</button></div>
 <div id="fight"><button id="attack">⚔</button><button id="special">✦</button></div>
</div>
<div id="panel">
 <div class="card">
  <h1>SOULKILLER</h1>
  <p>O mundo caiu. Derrote os guardiões, fortaleça sua alma e conquiste os reinos perdidos.</p>
  <div id="menuinfo" class="small"></div>
  <button onclick="startGame()">INICIAR A JORNADA</button>
  <button onclick="showRegions()">REGIÕES</button>
  <button onclick="showHelp()">COMO JOGAR</button>
  <div id="choices"></div>
  <p class="small">Explore · Lute · Evolua · Derrote os 8 chefes</p>
 </div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=960,H=540,last=0,game=false,paused=false,zone=0,secret=false;
let level=1,xp=0,souls=0,kills=0,unlocked=0,health=100,maxHealth=100;
let player={x:130,y:0,vx:0,vy:0,w:28,h:43,face:1,onGround:false,inv:0};
let enemies=[],particles=[],boss=null,spawnTimer=0,attackTimer=0,specialTimer=0,worldTime=0;
let keys={},move={left:false,right:false};
const regions=[
{name:"Floresta dos Condenados",boss:"Guardião de Raízes",emoji:"🌳",bg:"#182c22",ground:"#34442d",foes:["Zumbi","Lobo Sombrio","Goblin"],color:"#76ad58"},
{name:"Catedral Celestial",boss:"Serafim Caído",emoji:"👼",bg:"#29243d",ground:"#50415e",foes:["Monge Corrompido","Anjo Caído","Cavaleiro"],color:"#e5d8ff"},
{name:"Abismo do Dragão",boss:"Dragão Ancestral",emoji:"🐉",bg:"#351b20",ground:"#57292b",foes:["Dragão Vermelho","Diabrete","Ogro"],color:"#fa6446"},
{name:"Pântano das Almas",boss:"Bruxa do Pântano",emoji:"🧙",bg:"#172b29",ground:"#304943",foes:["Zumbi do Pântano","Sapo Gigante","Bruxa Menor"],color:"#8cd9a0"},
{name:"Deserto das Estrelas Mortas",boss:"Colosso de Areia",emoji:"🗿",bg:"#453222",ground:"#80603b",foes:["Escorpião","Ogro de Areia","Múmia"],color:"#f4c36d"},
{name:"Fortaleza do Vazio",boss:"Rei do Vazio",emoji:"👑",bg:"#191927",ground:"#39334c",foes:["Cavaleiro do Vazio","Espectro","Demônio"],color:"#bd8aff"},
{name:"Mar de Gelo",boss:"Titã Glacial",emoji:"❄️",bg:"#172a3c",ground:"#41657a",foes:["Lobo Glacial","Golem de Gelo","Gigante"],color:"#a9e8ff"},
{name:"Trono dos Deuses",boss:"Deus Exilado",emoji:"⚡",bg:"#33202f",ground:"#62405b",foes:["Deus Menor","Dragão Celestial","Titã Caído"],color:"#ffd1e8"}
];
const secrets=[
{name:"Cidade Perdida",bg:"#30303a",ground:"#56505b",foes:["Sentinela Antiga","Assassino Espectral","Golem Real"],boss:"Rei Esquecido",color:"#f0c87d"},
{name:"Floresta Cristalina",bg:"#123b3d",ground:"#23635b",foes:["Lobo de Cristal","Fada Sombria","Golem Cristalino"],boss:"Cervo Prismático",color:"#8affed"},
{name:"Ilhas Flutuantes",bg:"#25264a",ground:"#454a78",foes:["Águia Demoníaca","Guardião Aéreo","Dragão das Nuvens"],boss:"Titã Celeste",color:"#b9baff"},
{name:"Biblioteca Proibida",bg:"#291c35",ground:"#51375c",foes:["Livro Vivo","Mago Imortal","Sombra Letrada"],boss:"Arquivista Eterno",color:"#e3a5ff"}
];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;W=canvas.width;H=canvas.height;ctx.setTransform(1,0,0,1,0,0)}
addEventListener("resize",resize);resize();
function groundY(){return H*.82}
function scale(){return Math.min(W/960,H/540)}
function say(t){document.getElementById("message").textContent=t;setTimeout(()=>{if(document.getElementById("message").textContent===t)document.getElementById("message").textContent=""},1800)}
function menu(title,html){paused=true;game=false;document.getElementById("panel").classList.remove("hidden");document.querySelector(".card h1").textContent=title;document.getElementById("choices").innerHTML=html}
function startGame(){document.getElementById("panel").classList.add("hidden");paused=false;game=true;player.y=groundY()-player.h;player.x=130;last=performance.now();if(!boss&&!enemies.length)spawnTimer=1;requestAnimationFrame(loop)}
function showHelp(){menu("COMO JOGAR",'<p class="small">Use ◀ ▶ para andar, ⬆ para pular, ⚔ para atacar e ✦ para o golpe especial. Derrote inimigos para ganhar almas e XP. A cada nível, você fica mais forte. Derrote o chefe de cada região para avançar.</p><button onclick="mainMenu()">VOLTAR</button>')}
function mainMenu(){menu("SOULKILLER",'<button onclick="startGame()">CONTINUAR</button><button onclick="showRegions()">REGIÕES</button><button onclick="showHelp()">COMO JOGAR</button>')}
function showRegions(){let html=regions.map((r,i)=>`<button ${i>unlocked?'disabled':''} onclick="goRegion(${i},false)">${i+1}. ${r.name}${i>unlocked?' 🔒':''}</button>`).join("");html+=secrets.map((r,i)=>`<button ${unlocked<8?'disabled':''} onclick="goRegion(${i},true)">${r.name}${unlocked<8?' 🔒':' ✦'}</button>`).join("");html+='<button onclick="mainMenu()">VOLTAR</button>';menu("MAPA DO MUNDO",html)}
function goRegion(i,s){if(s&&unlocked<8)return;if(!s&&i>unlocked)return;zone=i;secret=s;enemies=[];boss=null;player.x=100;health=maxHealth;worldTime=0;startGame();say("Região: "+current().name)}
function current(){return secret?secrets[zone]||secrets[0]:regions[zone]||regions[7]}
function spawnEnemy(){let r=current(),idx=Math.min(r.foes.length-1,Math.floor(Math.random()*r.foes.length));let mini=Math.random()<.12;let z=secret?8+zone:zone;let e={x:W+Math.random()*100,y:0,w:mini?42:30,h:mini?55:39,hp:(35+z*22+level*4)*(mini?2:1),max:0,damage:8+z*3,speed:45+z*8+Math.random()*30,name:mini?"ELITE "+r.foes[idx]:r.foes[idx],color:mini?"#ffb447":r.color,mini:mini,dead:false};e.max=e.hp;e.y=groundY()-e.h;enemies.push(e)}
function spawnBoss(){let r=current(),z=secret?8+zone:zone;boss={x:W-180,y:0,w:90,h:100,hp:280+z*180+z*z*18,max:280+z*180+z*z*18,damage:15+z*5,name:r.boss,color:r.color,attack:0};boss.y=groundY()-boss.h;document.getElementById("bossbox").classList.remove("hidden");document.getElementById("bossname").textContent=boss.name;say("CHEFE: "+boss.name)}
function gainXP(n){xp+=n;while(xp>=level*50){xp-=level*50;level++;maxHealth+=15;health=maxHealth;say("NÍVEL "+level+"! VIDA E DANO AUMENTARAM");}}
function hurt(n){if(player.inv>0)return;health-=n;player.inv=.8;player.vy=-150;if(health<=0){health=0;game=false;menu("VOCÊ FOI DERROTADO",`<p>Você chegou ao nível ${level} e conseguiu ${souls} almas.</p><button onclick="restart()">TENTAR NOVAMENTE</button><button onclick="mainMenu()">MENU</button>`)}}
function restart(){health=maxHealth;player.x=100;player.vy=0;enemies=[];boss=null;startGame()}
function attack(){if(!game||attackTimer>0)return;attackTimer=.35;let dmg=18+level*6;let target=boss&&Math.abs(boss.x-player.x)<170?boss:enemies.find(e=>Math.abs(e.x-player.x)<115);if(target){target.hp-=dmg;particles.push({x:target.x,y:target.y,color:"#ffe3a3",life:.3});if(target.hp<=0){if(target===boss){boss=null;document.getElementById("bossbox").classList.add("hidden");unlocked=Math.max(unlocked,secret?8:zone+1);souls+=secret?100:60;gainXP(secret?120:100);say("CHEFE DERROTADO!");enemies=[];if(unlocked>=8&&!secret)say("TODOS OS CHEFES DERROTADOS! ÁREAS SECRETAS LIBERADAS!");setTimeout(()=>{if(!game)mainMenu()},1600)}else{enemies=enemies.filter(e=>e!==target);souls+=target.mini?18:5;kills++;gainXP(target.mini?28:12)}}}}
function special(){if(!game||specialTimer>0)return;specialTimer=4;let dmg=55+level*14;enemies.forEach(e=>e.hp-=dmg);enemies=enemies.filter(e=>e.hp>0);if(boss){boss.hp-=dmg;if(boss.hp<=0){boss.hp=1;attack()}}particles.push({x:player.x,y:player.y,color:"#dca3ff",life:.5});say("GOLPE DAS ALMAS!")}
function bindHold(id,fn,prop){let b=document.getElementById(id);b.addEventListener("pointerdown",e=>{e.preventDefault();if(prop)move[prop]=true;else fn()});["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>{if(prop)move[prop]=false}))}
bindHold("left",null,"left");bindHold("right",null,"right");bindHold("jump",()=>{if(player.onGround){player.vy=-430;player.onGround=false}});bindHold("attack",attack);bindHold("special",special);
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key===" "||e.key==="ArrowUp"){if(player.onGround){player.vy=-430;player.onGround=false}}if(e.key.toLowerCase()==="j")attack();if(e.key.toLowerCase()==="k")special()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function drawText(t,x,y,size,color="#fff"){ctx.font=`bold ${size}px monospace`;ctx.fillStyle="#000";ctx.fillText(t,x+2,y+2);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawCharacter(e,hero=false){let x=e.x,y=e.y;ctx.fillStyle=hero?"#342044":e.color;ctx.fillRect(x+4,y+8,e.w-8,e.h-12);ctx.fillStyle=hero?"#d8b5ff":"#2a1522";ctx.fillRect(x+5,y,e.w-10,18);ctx.fillStyle=hero?"#fff":"#ff534f";ctx.fillRect(x+9,y+6,5,4);ctx.fillRect(x+e.w-14,y+6,5,4);ctx.fillStyle=hero?"#b8a3d6":"#16131b";ctx.fillRect(x+3,y+e.h-8,9,8);ctx.fillRect(x+e.w-12,y+e.h-8,9,8);if(hero&&attackTimer>0){ctx.strokeStyle="#fff0a3";ctx.lineWidth=5;ctx.beginPath();ctx.arc(x+e.w/2+player.face*25,y+e.h/2,30,-1,1);ctx.stroke()}}
function update(dt){worldTime+=dt;attackTimer=Math.max(0,attackTimer-dt);specialTimer=Math.max(0,specialTimer-dt);player.inv=Math.max(0,player.inv-dt);
let dir=(move.right||keys.arrowright||keys.d?1:0)-(move.left||keys.arrowleft||keys.a?1:0);player.vx=dir*245;if(dir)player.face=dir;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(W-player.w,player.x));player.vy+=1200*dt;player.y+=player.vy*dt;if(player.y+player.h>=groundY()){player.y=groundY()-player.h;player.vy=0;player.onGround=true}else player.onGround=false;
spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<4&&!boss){spawnEnemy();spawnTimer=Math.max(1.2,3-zone*.15)}
for(let e of enemies){e.x-=e.speed*dt;if(Math.abs(e.x-player.x)<e.w+player.w-4&&Math.abs(e.y-player.y)<e.h){hurt(e.damage*dt*2);player.x-=player.face*20}}
enemies=enemies.filter(e=>e.x>-150);
if(boss){boss.attack-=dt;boss.x+=Math.sign(player.x-boss.x)*Math.min(Math.abs(player.x-boss.x),boss.x>player.x?25:12)*dt;if(boss.attack<=0&&Math.abs(boss.x-player.x)<160){hurt(boss.damage);boss.attack=1.5}document.getElementById("bosshp").style.width=Math.max(0,boss.hp/boss.max*100)+"%"}
if(!boss&&!enemies.length&&worldTime>20)spawnBoss();
for(let p of particles)p.life-=dt;particles=particles.filter(p=>p.life>0);
document.getElementById("hp").style.width=health/maxHealth*100+"%";document.getElementById("xpbar").style.width=xp/(level*50)*100+"%";document.getElementById("playerstats").textContent=`Nível ${level} · XP ${xp}/${level*50} · Almas ${souls} · Abates ${kills}`;document.getElementById("region").textContent=(secret?"ÁREA SECRETA: ":"REGIÃO "+(zone+1)+": ")+current().name}
function render(){ctx.clearRect(0,0,W,H);let r=current();ctx.fillStyle=r.bg;ctx.fillRect(0,0,W,H);
for(let i=0;i<8;i++){let x=(i*180-(worldTime*12)%180)*W/960;ctx.fillStyle="#ffffff0c";ctx.beginPath();ctx.arc(x,H*.3+(i%3)*35,45+i%3*15,0,Math.PI*2);ctx.fill()}
ctx.fillStyle=r.ground;ctx.fillRect(0,groundY(),W,H-groundY());ctx.fillStyle="#17131e";ctx.fillRect(0,groundY(),W,5);
for(let i=0;i<18;i++){let x=(i*73-(worldTime*22)%73)*W/960;ctx.fillStyle=r.color;ctx.fillRect(x,groundY()-7,3,7)}
if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.fillStyle=boss.color;ctx.fillRect(0,20,boss.w,boss.h-20);ctx.fillRect(12,0,18,30);ctx.fillRect(boss.w-30,0,18,30);ctx.fillStyle="#1b101b";ctx.fillRect(18,32,12,8);ctx.fillRect(boss.w-30,32,12,8);ctx.restore();drawText(boss.name,boss.x-25,boss.y-12,14,boss.color)}
enemies.forEach(e=>{drawCharacter(e);ctx.fillStyle="#17131e";ctx.fillRect(e.x,e.y-8,e.w,4);ctx.fillStyle=e.mini?"#ffb447":"#d64d54";ctx.fillRect(e.x,e.y-8,e.w*Math.max(0,e.hp/e.max),4);drawText(e.name,e.x-12,e.y-12,9)});
if(!(player.inv>0&&Math.floor(worldTime*15)%2===0))drawCharacter(player,true);
particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillRect(p.x+Math.random()*35,p.y+Math.random()*35,6,6);ctx.globalAlpha=1});
if(!boss&&!enemies.length)drawText("CAMINHO LIVRE...",W*.42,H*.2,14,"#fff1b0")}
function loop(now){if(!game||paused)return;let dt=Math.min((now-last)/1000,.035);last=now;update(dt);render();requestAnimationFrame(loop)}
document.getElementById("menuinfo").textContent="Melhor nível: "+(localStorage.skLevel||1)+" · Almas guardadas: "+(localStorage.skSouls||0);
addEventListener("beforeunload",()=>{localStorage.skLevel=level;localStorage.skSouls=souls});
render();
</script>
</body>
</html>
